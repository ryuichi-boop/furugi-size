<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>古着 採寸＆検品ビルダー</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: #f8fafc; padding: 12px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 480px; }
    h1 { font-size: 1.25rem; font-weight: bold; margin-bottom: 12px; text-align: center; color: #38bdf8; }
    
    .card { background: #1e293b; border-radius: 12px; padding: 14px; margin-bottom: 12px; border: 1px solid #334155; }
    .type-tabs { display: flex; gap: 6px; margin-bottom: 10px; }
    .type-btn { flex: 1; padding: 10px 0; border: none; border-radius: 8px; font-weight: bold; font-size: 0.9rem; cursor: pointer; background: #334155; color: #94a3b8; transition: 0.2s; }
    .type-btn.active { background: #0284c7; color: #fff; }

    .size-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 12px; }
    .size-field { background: #090d16; border: 2px solid #334155; border-radius: 8px; padding: 8px 10px; cursor: pointer; display: flex; flex-direction: column; }
    .size-field.focused { border-color: #38bdf8; background: #0f233a; }
    .field-label { font-size: 0.75rem; color: #94a3b8; font-weight: bold; }
    .field-val { font-size: 1.35rem; font-weight: bold; color: #fff; height: 32px; display: flex; align-items: center; }
    .field-unit { font-size: 0.85rem; color: #64748b; margin-left: 2px; }

    /* スマホ片手用テンキー */
    .numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 8px; }
    .num-btn { background: #334155; color: #fff; border: none; border-radius: 8px; padding: 12px 0; font-size: 1.3rem; font-weight: bold; cursor: pointer; }
    .num-btn:active { background: #475569; }
    .btn-act { background: #475569; font-size: 1rem; }
    .btn-next { background: #059669; color: #fff; font-size: 1rem; }

    /* コンディション・タグ選択 */
    .tag-group-title { font-size: 0.85rem; color: #38bdf8; font-weight: bold; margin: 8px 0 6px 0; }
    .tags-container { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag-chip { padding: 8px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 500; background: #090d16; border: 1px solid #475569; color: #cbd5e1; cursor: pointer; }
    .tag-chip.selected { background: #4338ca; border-color: #818cf8; color: #fff; font-weight: bold; }

    /* 生成テキストエリア */
    .preview-box { width: 100%; height: 160px; background: #090d16; border: 1px solid #475569; border-radius: 8px; color: #e2e8f0; padding: 10px; font-size: 0.85rem; line-height: 1.5; margin-bottom: 8px; resize: none; }
    .copy-btn { width: 100%; background: #0284c7; color: #fff; border: none; padding: 15px; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; }
    .clear-btn { width: 100%; background: #475569; color: #cbd5e1; border: none; padding: 10px; border-radius: 8px; font-size: 0.85rem; margin-top: 8px; cursor: pointer; }
  </style>
</head>
<body>

<div class="container">
  <h1>📐 古着 採寸＆検品ビルダー</h1>

  <div class="card">
    <div class="type-tabs">
      <button class="type-btn active" onclick="switchCategory('tops')">👕 トップス</button>
      <button class="type-btn" onclick="switchCategory('pants')">👖 パンツ</button>
      <button class="type-btn" onclick="switchCategory('outer')">🧥 アウター</button>
    </div>

    <!-- 採寸入力ボックス -->
    <div class="size-grid" id="sizeGrid"></div>

    <!-- 電卓風テンキー -->
    <div class="numpad">
      <button class="num-btn" onclick="inputNum('1')">1</button>
      <button class="num-btn" onclick="inputNum('2')">2</button>
      <button class="num-btn" onclick="inputNum('3')">3</button>
      <button class="num-btn" onclick="inputNum('4')">4</button>
      <button class="num-btn" onclick="inputNum('5')">5</button>
      <button class="num-btn" onclick="inputNum('6')">6</button>
      <button class="num-btn" onclick="inputNum('7')">7</button>
      <button class="num-btn" onclick="inputNum('8')">8</button>
      <button class="num-btn" onclick="inputNum('9')">9</button>
      <button class="num-btn btn-act" onclick="inputNum('.')">.</button>
      <button class="num-btn" onclick="inputNum('0')">0</button>
      <button class="num-btn btn-act" onclick="backspace()">⌫</button>
    </div>
    <div style="display: flex; gap: 6px;">
      <button class="num-btn btn-act" style="flex:1; padding: 10px 0;" onclick="clearCurrentField()">C (消去)</button>
      <button class="num-btn btn-next" style="flex:2; padding: 10px 0;" onclick="focusNextField()">次へ ➜</button>
    </div>
  </div>

  <div class="card">
    <div class="tag-group-title">🏷️ 全体コンディション</div>
    <div class="tags-container" id="conditionTags">
      <div class="tag-chip selected" onclick="toggleSingleSelect(this, 'cond')">目立った傷や汚れなし</div>
      <div class="tag-chip" onclick="toggleSingleSelect(this, 'cond')">やや傷や汚れあり</div>
      <div class="tag-chip" onclick="toggleSingleSelect(this, 'cond')">ヴィンテージ相応の味あり</div>
      <div class="tag-chip" onclick="toggleSingleSelect(this, 'cond')">デッドストック・未使用に近い</div>
    </div>

    <div class="tag-group-title">🔍 ダメージ・特記事項（複数選択可）</div>
    <div class="tags-container" id="damageTags">
      <div class="tag-chip" onclick="toggleMultiSelect(this)">首元に着用感・微ヨレあり</div>
      <div class="tag-chip" onclick="toggleMultiSelect(this)">目立たない程度の薄い汚れあり</div>
      <div class="tag-chip" onclick="toggleMultiSelect(this)">ピンホール（小穴）あり</div>
      <div class="tag-chip" onclick="toggleMultiSelect(this)">袖口/裾に軽い擦れあり</div>
      <div class="tag-chip" onclick="toggleMultiSelect(this)">程よいフェード感（色落ち）良好</div>
      <div class="tag-chip" onclick="toggleMultiSelect(this)">プリントひび割れあり（味あり）</div>
    </div>
  </div>

  <div class="card">
    <div style="font-size: 0.85rem; color: #38bdf8; font-weight: bold; margin-bottom: 6px;">📄 生成された出品テキストブロック</div>
    <textarea id="outputArea" class="preview-box" readonly onclick="this.select();"></textarea>
    <button class="copy-btn" onclick="copyOutput()">📋 採寸＆検品文をコピー</button>
    <button class="clear-btn" onclick="resetAll()">🔄 すべてリセット</button>
  </div>
</div>

<script>
  const categories = {
    tops: [
      { key: '着丈', val: '' },
      { key: '身幅', val: '' },
      { key: '肩幅', val: '' },
      { key: '袖丈', val: '' }
    ],
    pants: [
      { key: 'ウエスト', val: '', note: '平置き×2' },
      { key: '股下', val: '' },
      { key: '股上', val: '' },
      { key: 'ワタリ幅', val: '' },
      { key: '裾幅', val: '' }
    ],
    outer: [
      { key: '着丈', val: '' },
      { key: '身幅', val: '' },
      { key: '裄丈/肩幅', val: '' },
      { key: '袖丈', val: '' }
    ]
  };

  let currentCat = 'tops';
  let activeFieldIndex = 0;

  function switchCategory(cat) {
    currentCat = cat;
    activeFieldIndex = 0;
    document.querySelectorAll('.type-btn').forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');
    renderFields();
    generateText();
  }

  function renderFields() {
    const grid = document.getElementById('sizeGrid');
    grid.innerHTML = '';
    categories[currentCat].forEach((f, idx) => {
      const isFocused = (idx === activeFieldIndex);
      const noteHtml = f.note ? `<span style="font-size:0.65rem; color:#64748b; margin-left:4px;">(${f.note})</span>` : '';
      const div = document.createElement('div');
      div.className = `size-field ${isFocused ? 'focused' : ''}`;
      div.onclick = () => { activeFieldIndex = idx; renderFields(); };
      div.innerHTML = `
        <div class="field-label">${f.key}${noteHtml}</div>
        <div class="field-val">${f.val || '-'}<span class="field-unit">${f.val ? 'cm' : ''}</span></div>
      `;
      grid.appendChild(div);
    });
  }

  function inputNum(char) {
    const f = categories[currentCat][activeFieldIndex];
    if (char === '.' && f.val.includes('.')) return;
    if (f.val.length >= 5) return;
    f.val += char;
    renderFields();
    generateText();
  }

  function backspace() {
    const f = categories[currentCat][activeFieldIndex];
    f.val = f.val.slice(0, -1);
    renderFields();
    generateText();
  }

  function clearCurrentField() {
    categories[currentCat][activeFieldIndex].val = '';
    renderFields();
    generateText();
  }

  function focusNextField() {
    if (activeFieldIndex < categories[currentCat].length - 1) {
      activeFieldIndex++;
    } else {
      activeFieldIndex = 0;
    }
    renderFields();
  }

  function toggleSingleSelect(el, group) {
    el.parentElement.querySelectorAll('.tag-chip').forEach(c => c.classList.remove('selected'));
    el.classList.add('selected');
    generateText();
  }

  function toggleMultiSelect(el) {
    el.classList.toggle('selected');
    generateText();
  }

  function generateText() {
    let text = '【実寸サイズ（平置き cm）】\n';
    categories[currentCat].forEach(f => {
      const valStr = f.val ? `${f.val}cm` : '測定中 / 採寸なし';
      text += `・${f.key}：${valStr}\n`;
    });
    text += '※素人採寸のため、多少の誤差はご了承ください。\n\n';

    text += '【商品の状態・コンディション】\n';
    const condEl = document.querySelector('#conditionTags .selected');
    if (condEl) text += `ランク：${condEl.textContent}\n`;

    const damageEls = document.querySelectorAll('#damageTags .selected');
    if (damageEls.length > 0) {
      damageEls.forEach(d => {
        text += `・${d.textContent}\n`;
      });
      text += '※古着特有の風合いをご理解の上、ご検討をお願いいたします。\n';
    } else {
      text += '・目立つような大きな破れや致命的ダメージはなく、着用に問題のない良好な状態です。\n';
    }

    document.getElementById('outputArea').value = text;
  }

  function copyOutput() {
    const text = document.getElementById('outputArea').value;
    if (!text) return;
    navigator.clipboard.writeText(text).then(() => {
      alert('📋 採寸＆検品文をコピーしました！\nメルカリの説明文にそのまま貼り付けられます。');
    }).catch(() => {
      prompt('手動コピーしてください:', text);
    });
  }

  function resetAll() {
    if (!confirm('入力内容をリセットしますか？')) return;
    Object.keys(categories).forEach(k => {
      categories[k].forEach(f => f.val = '');
    });
    document.querySelectorAll('#damageTags .selected').forEach(c => c.classList.remove('selected'));
    activeFieldIndex = 0;
    renderFields();
    generateText();
  }

  renderFields();
  generateText();
</script>

</body>
</html>
